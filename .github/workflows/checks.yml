name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # mlx only installs on macOS, and pyright needs it importable
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check src tools
      - run: uv run ruff format --check src tools
      - run: uv run pyright
