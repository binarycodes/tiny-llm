[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm"
version = "0.1.0a1"
description = "A tiny language model trained on Vaadin documentation with MLX"
requires-python = ">=3.13"
dependencies = [
    "mlx",
    "numpy",
    "safetensors",
    "tokenizers",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tools"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
