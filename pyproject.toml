[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-llm"
version = "0.1.0a1"
description = "A tiny language model trained on Vaadin documentation with MLX"
requires-python = ">=3.13"
dependencies = [
    "mlx",
    "numpy",
    "safetensors",
    "tokenizers",
]

[project.scripts]
train-tokenizer = "tiny_llm.train_tokenizer:main"
tokenize = "tiny_llm.tokenize_dataset:main"
train = "tiny_llm.train:main"
generate = "tiny_llm.generate:main"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "PL"]
# MLX documents `import mlx.nn as nn`
ignore = ["PLR0402"]

[tool.pyright]
pythonVersion = "3.13"
include = ["src", "tools"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
